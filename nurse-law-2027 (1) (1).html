 ['directive-change','directive','작성자는 사전연명의료의향서를 언제 변경하거나 철회할 수 있나요?','언제든지',['등록 후 7일 이내','등록 후 30일 이내','등록 후 1년 이내','말기 진단을 받은 뒤에만'],'작성자는 언제든지 의사를 바꿀 수 있습니다. 등록기관의 장은 지체 없이 변경 또는 등록 말소를 해야 합니다.','등록한 지 수년이 지난 사람이 사전연명의료의향서를 철회하려 한다. 철회할 수 있는 시점은?'],
 ['directive-conflict','directive','사전연명의료의향서를 작성·등록한 뒤 연명의료계획서를 다시 작성했다. 기존 의향서의 효력은?','계획서를 작성한 때부터 효력을 잃는다',['두 문서가 언제나 같은 효력을 가진다','등록 후 1년이 지나야 효력을 잃는다','처음부터 효력이 없었던 것으로 본다','환자가 사망할 때까지 효력을 유지한다'],'제12조제8항제4호는 이후 계획서가 작성되면 그때부터 기존 의향서가 효력을 잃는다고 정합니다.','등록된 사전연명의료의향서 이후 연명의료계획서를 새로 작성했다. 기존 의향서가 효력을 잃는 시점은?'],
 ['dying-normal','dying','법 제16조제1항에 따른 임종과정 판단 주체는?','담당의사와 해당 분야 전문의 1명',['담당의사와 담당 간호사','의료기관의 장과 보호자','담당의사와 환자 가족','윤리위원회 위원장'],'일반적으로 담당의사가 해당 분야 전문의 1명과 함께 판단하고 결과를 기록합니다.','호스피스 예외가 적용되지 않는 환자의 임종과정 여부를 판단하는 두 사람의 조합은?'],
 ['dying-hospice','dying','호스피스전문기관에서 호스피스를 이용하는 말기환자의 임종과정 판단은 누구의 판단으로 갈음할 수 있나요?','담당의사',['담당 간호사','환자 가족 대표','등록기관의 장','윤리위원회 위원장'],'제16조제2항은 해당 호스피스 이용 말기환자에 대해 담당의사의 판단으로 갈음할 수 있도록 합니다.','제16조제2항의 호스피스 예외를 적용할 때 임종과정 판단을 할 수 있는 사람은?'],
 ['execution-care','execution','연명의료중단등결정을 이행할 때 법 제19조제2항이 중단을 금지하는 처치는?','산소의 단순 공급',['심폐소생술','혈액 투석','항암제 투여','인공호흡기 착용'],'통증 완화 의료행위와 영양분·물 공급, 산소의 단순 공급은 시행하지 않거나 중단해서는 안 됩니다.','연명의료중단등결정 이행 중 산소 관련 처치 가운데 법이 중단을 금지한 것은?'],
 ['execution-notify','execution','의료기관의 장은 연명의료중단등결정 이행 결과를 누구에게 통보해야 하나요?','관리기관의 장',['관할 경찰서장','건강보험심사평가원장','시·도지사','관할 소방서장'],'의료기관의 장은 이행 결과를 지체 없이 보건복지부령으로 정하는 바에 따라 관리기관의 장에게 통보해야 합니다.','의료기관의 장이 제19조제5항에 따라 이행 결과를 지체 없이 전달할 상대는?'],
 ['execution-retention','retention','연명의료중단등결정 및 이행에 관한 법 제20조의 기록 보존기간은?','이행 후 10년',['이행 후 2년','이행 후 3년','이행 후 5년','이행 후 7년'],'의료기관의 장은 제20조에서 정한 기록을 연명의료중단등결정 이행 후 10년 동안 보존합니다.','연명의료중단등결정을 이행했다. 관련 기록 보존기간을 계산할 기준과 기간의 조합은?']
].forEach(row=>add(...row));

const key = 'nurse-law-2027-v1';
const app = document.querySelector('#app');
const message = document.querySelector('#message');
const byId = Object.fromEntries(bank.map(item=>[item.id,item]));
const intervals = [600000,86400000,259200000,604800000,1209600000];
const blank = () => ({version:1, total:0, since:0, cursor:0, records:{}, session:null});
let state = blank();
let selected = null;
function valid(data) {
  const count = value => Number.isSafeInteger(value) && value >= 0;
  if (!data || data.version!==1 || ![data.total,data.since,data.cursor].every(count) ||
      data.since>data.total || data.cursor>=bank.length || !data.records || Array.isArray(data.records) ||
      typeof data.records!=='object') return false;
  if (!Object.entries(data.records).every(([id,r])=>Object.hasOwn(byId,id) && r &&
      Number.isInteger(r.stage) && r.stage>=-1 && r.stage<intervals.length &&
      count(r.due) && typeof r.pending==='boolean')) return false;
  const s=data.session;
  return s===null || (s && ['study','review'].includes(s.mode) && Array.isArray(s.items) &&
    s.items.length>0 && s.items.length<=10 && new Set(s.items.map(item=>item?.id)).size===s.items.length &&
    count(s.index) && s.index<=s.items.length && count(s.score) &&
    s.score<=Math.min(s.index+(s.result?1:0),s.items.length) &&
    s.items.every(item=>{
      const q=item && Object.hasOwn(byId,item.id) && byId[item.id];
      return q && Array.isArray(item.options) && item.options.length===5 &&
        new Set(item.options).size===5 && item.options.every(x=>[q.answer,...q.distractors].includes(x));
    }) && (s.result===null || (s.index<s.items.length &&
      s.items[s.index].options.includes(s.result.answer) && typeof s.result.unsure==='boolean')));
}
try {
  const saved = JSON.parse(localStorage.getItem(key));
  if (valid(saved)) state=saved;
} catch { message.textContent='저장된 기록을 읽지 못했습니다. 백업 파일을 불러올 수 있습니다.'; }
function save() {
  try { localStorage.setItem(key,JSON.stringify(state)); return true; }
  catch { message.textContent='이 브라우저에서는 자동 저장을 사용할 수 없습니다. 닫기 전에 기록을 내보내세요.'; return false; }
}
function shuffle(values) {
  const result=[...values];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function reviewQueue(now=Date.now()) {
  return Object.entries(state.records)
    .filter(([,r])=>r.due<=now || (state.since>=20 && r.pending))
    .sort((a,b)=>a[1].due-b[1].due).map(([id])=>id);
}
function start(mode) {
  const review=reviewQueue();
  if(mode==='review' && !review.length) return render();
  const ids=mode==='review' ? review.slice(0,10) :
    Array.from({length:10},(_,i)=>bank[(state.cursor+i)%bank.length].id);
  state.session={mode,items:ids.map(id=>({id,options:shuffle([byId[id].answer,...byId[id].distractors])})),index:0,score:0,result:null};
  if(mode==='study') state.cursor=(state.cursor+10)%bank.length;
  selected=null;
  save(); render(true);
}
function submit(unsure) {
  const s=state.session;
  if(!s || s.result || s.index>=s.items.length || selected===null) return;
  const q=byId[s.items[s.index].id];
  const correct=selected===q.answer;
  const now=Date.now();
  const old=state.records[q.id];
  if(!correct || unsure){
    state.records[q.id]={stage:-1,due:now+intervals[0],pending:true};
  }else if(!old || (s.mode==='review' && old.due<=now)){
    const stage=Math.min((old?.stage??0)+1,intervals.length-1);
    state.records[q.id]={stage,due:now+intervals[stage],pending:false};
  }else if(s.mode==='review'){
    old.pending=false;
  }
  if(s.mode==='study'){
    state.total++;
    state.since++;
  }
  if(correct) s.score++;
  s.result={answer:selected,unsure};
  save(); render(true);
}
function next() {
  const s=state.session;
  if(!s?.result) return;
  s.index++; s.result=null; selected=null;
  save(); render(true);
}
function home() {
  const s=state.session;
  if(s?.mode==='review' && s.index===s.items.length && state.since>=20 &&
      !Object.values(state.records).some(record=>record.pending)) state.since=0;
  state.session=null; selected=null; save(); render(true);
}
function button(id, action) { document.getElementById(id)?.addEventListener('click',action); }
function render(focus=false) {
  const s=state.session;
  const queued=reviewQueue().length;
  if(!s){
    app.innerHTML=`<span class="badge">오프라인 학습</span><h1 tabindex="-1">오늘 법규 10문제</h1>
    <p class="muted">한 문제씩 풀고 바로 해설을 확인해요. 틀리거나 헷갈린 개념은 복습에 다시 나와요.</p>
    <div class="stats"><div class="stat"><strong>${state.total}</strong>학습한 문제</div><div class="stat"><strong>${queued}</strong>지금 복습 가능</div><div class="stat"><strong>${bank.length}</strong>연습 문항</div></div>
    <div class="actions"><button id="study" class="${queued?'':'primary'}">10문제 시작</button>${queued?'<button id="review" class="primary">복습 시작</button>':''}</div>
    <p class="muted">일반 학습 20문제 후 오답 복습을 열어요. 오답과 헷갈린 문제는 약 10분 후에도 복습할 수 있어요.</p>
    <p class="muted">의료법 시행규칙 · 감염병예방법 · 국민건강보험법 · 지역보건법 · 응급의료법 · 연명의료결정법 일부 조항으로 구성한 체험판</p>`;
    button('study',()=>start('study')); button('review',()=>start('review'));
  }else if(s.index===s.items.length){
    const title=s.mode==='study'?'한 세트 완료':'복습 완료';
    app.innerHTML=`<h1 tabindex="-1">${title}</h1><p>${s.items.length}문제 중 <strong>${s.score}문제</strong>를 맞혔어요.</p>
    <p class="muted">${queued?'지금 복습할 문제 '+queued+'개가 있어요.':'복습 시간이 되면 홈에서 다시 풀 수 있어요.'}</p>
    <div class="actions"><button id="home" class="primary">홈으로</button>${queued?'<button id="review">복습 시작</button>':''}</div>`;
    button('home',home); button('review',()=>start('review'));
  }else{
    const item=s.items[s.index], q=byId[item.id], result=s.result;
    const correct=result?.answer===q.answer;
    const [law,url]=sources[q.source];
    app.innerHTML=`<small>${s.mode==='study'?'일반 학습':'복습'} · ${s.index+1} / ${s.items.length}</small>
    <progress max="${s.items.length}" value="${s.index+(result?1:0)}" aria-label="풀이 진행률"></progress>
    <h2 tabindex="-1">${s.mode==='review'?q.variant:q.prompt}</h2>
    <div>${item.options.map((option,i)=>{
      const style=result?(option===q.answer?'correct':option===result.answer?'wrong':''):(option===selected?'selected':'');
      const mark=result?(option===q.answer?' · 정답':option===result.answer?' · 내 답':''):'';
      return `<button class="choice ${style}" id="choice${i}" ${result?'disabled':'aria-pressed="'+(option===selected)+'"'}>${i+1}. ${option}${mark}</button>`;
    }).join('')}</div>
    ${result?`<div class="feedback" role="status"><strong>${correct?(result.unsure?'정답 · 복습에 추가':'정답이에요'):'오답 · 복습에 추가'}</strong>
    <p>${q.explanation}</p><small>근거 · <a href="${url}" target="_blank" rel="noopener">${law}</a></small></div>
    <div class="actions"><button id="next" class="primary">${s.index+1===s.items.length?'결과 보기':'다음 문제'}</button></div>`:
    `<div class="actions"><button id="submit" class="primary" ${selected===null?'disabled':''}>정답 확인</button>
    <button id="unsure" ${selected===null?'disabled':''}>헷갈렸어요 · 채점</button></div>`}`;
    if(!result){
      item.options.forEach((option,i)=>button('choice'+i,()=>{
        selected=option; render(); document.getElementById('choice'+i).focus();
      }));
      button('submit',()=>submit(false)); button('unsure',()=>submit(true));
    }
    button('next',next);
  }
  if(focus) app.querySelector('h1,h2')?.focus();
}
button('export',()=>{
  const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
  const link=document.createElement('a');
  link.href=url; link.download='nurse-law-record.json'; link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});
const file=document.querySelector('#file');
button('import',()=>file.click());
file.addEventListener('change',async()=>{
  const source=file.files[0];
  file.value='';
  if(!source) return;
  try{
    if(source.size>100000) throw Error();
    const incoming=JSON.parse(await source.text());
    if(!valid(incoming)) throw Error();
    if((state.total || state.session) && !confirm('현재 학습 기록을 이 백업으로 바꿀까요?')) return;
    state=incoming; selected=null;
    if(save()) message.textContent='학습 기록을 불러왔습니다.';
    render(true);
  }catch{message.textContent='이 앱에서 내보낸 올바른 학습 기록 파일을 선택해 주세요.';}
});
render();
setInterval(()=>{if(!state.session) render();},30000);
</script>
</html>
